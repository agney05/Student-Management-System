<!DOCTYPE html>
<html>

<head>
    <title>Students</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
    
</head>

<body>

    <nav>

        <a href="/">Home</a> |

        <a href="/students">Students</a> |

        <a href="/logout">Logout</a>

    </nav>

    <hr>

<h1>Student Records</h1>

<form action="/search" method="POST">
    <input type="text"
        name="keyword"
        placeholder="Search student">

    <button type="submit">
        Search
    </button>

</form>

<form action="/students">
    <button type="submit">
        View All Students
    </button>
</form>

<br>

<table border="1">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Roll No</th>
    <th>Branch</th>
    <th>Semester</th>
</tr>

{% for student in students %}

<tr>
    <td>{{ student[0] }}</td>
    <td>{{ student[1] }}</td>
    <td>{{ student[2] }}</td>
    <td>{{ student[3] }}</td>
    <td>{{ student[4] }}</td>
    <td>
    <a href="/edit/{{ student[0] }}">
        Edit
    </a>
    </td>
    <td>
        <a href="/delete/{{student[0]}}">
            Delete
        </a>
    </td>

</tr>


{% endfor %}

</table>

</body>

</html>
